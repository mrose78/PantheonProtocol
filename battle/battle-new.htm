<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANTHEON PROTOCOL: BATTLE ENGINE</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Google Fonts: Action/Comic Style -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Comic Neue', cursive, sans-serif;
      background-color: #fce7f3;
      background-image: radial-gradient(#f43f5e 1.5px, transparent 1.5px), radial-gradient(#f43f5e 1.5px, #fde047 1.5px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }

    .font-comic {
      font-family: 'Bangers', cursive;
      letter-spacing: 0.05em;
    }

    .font-header {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.08em;
    }

    .comic-box {
      border: 4px solid #000;
      box-shadow: 6px 6px 0px #000;
    }

    .comic-btn {
      border: 3px solid #000;
      box-shadow: 4px 4px 0px #000;
      transition: all 0.1s ease;
    }

    .comic-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000;
    }

    .comic-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    /* Custom scrollbar for combat logs */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #fef08a;
      border-left: 3px solid #000;
    }
    ::-webkit-scrollbar-thumb {
      background: #ef4444;
      border: 2px solid #000;
    }
  </style>
</head>
<body class="min-h-screen pb-12 text-black">

  <!-- TOP HEADER BANNER -->
  <header class="bg-yellow-400 border-b-8 border-black p-4 mb-6 shadow-2xl text-center relative overflow-hidden">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="text-center md:text-left">
        <h1 class="text-5xl md:text-6xl font-comic text-red-600 drop-shadow-[3px_3px_0px_#000] tracking-wider uppercase">
          PANTHEON PROTOCOL
        </h1>
        <p class="font-header text-xl md:text-2xl text-black tracking-widest uppercase bg-white px-3 py-1 inline-block border-2 border-black shadow-[3px_3px_0px_#000]">
          ⚡ Tactical Battle Simulator ⚡
        </p>
      </div>

      <!-- MODE TOGGLE BUTTONS -->
      <div class="flex items-center gap-3">
        <button id="mode-1v1" onclick="setBattleMode('1v1')" class="comic-btn px-4 py-2 font-comic text-2xl bg-cyan-400 hover:bg-cyan-300">
          1 vs 1 DUEL
        </button>
        <button id="mode-team" onclick="setBattleMode('team')" class="comic-btn px-4 py-2 font-comic text-2xl bg-gray-200 hover:bg-yellow-300">
          TEAM vs TEAM
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto px-4">
    
    <!-- LOADING SPINNER -->
    <div id="loading-state" class="comic-box bg-white p-8 text-center my-12 max-w-md mx-auto">
      <h2 class="font-comic text-4xl text-red-600 animate-pulse">LOADING HERO ARCHIVES...</h2>
      <p class="font-bold text-gray-700 mt-2">Fetching Roster & Image Database...</p>
    </div>

    <!-- MAIN BATTLE UI (Hidden until loaded) -->
    <div id="battle-ui" class="hidden space-y-6">

      <!-- SELECTION & SETUP ARENA -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- SIDE A / TEAM BLUE -->
        <div class="comic-box bg-cyan-100 p-4 relative">
          <div class="flex justify-between items-center mb-3">
            <div class="bg-cyan-500 text-white font-comic text-2xl px-3 py-1 border-2 border-black shadow-[3px_3px_0px_#000]">
              SIDE A / ALPHA SQUAD
            </div>
            <span id="count-a" class="font-comic text-xl bg-white border-2 border-black px-2 py-0.5">0 FIGHTERS</span>
          </div>

          <!-- TEAM AFFILIATION PRESET SELECTOR -->
          <div id="team-preset-a-container" class="hidden mb-4 p-2 bg-cyan-200 border-2 border-black">
            <label class="block font-bold text-xs uppercase mb-1">⚡ Load Entire Team Affiliation:</label>
            <select id="team-preset-a" onchange="loadTeamPreset('A')" class="comic-box w-full p-2 font-bold bg-white text-sm">
              <option value="">-- Select Team Preset --</option>
            </select>
          </div>
          
          <div id="team-a-slots" class="space-y-3"></div>

          <button id="add-a-btn" onclick="addTeamSlot('A')" class="comic-btn mt-4 w-full bg-cyan-300 font-comic text-lg py-1.5 hover:bg-cyan-200">
            + ADD INDIVIDUAL FIGHTER
          </button>
        </div>

        <!-- SIDE B / TEAM RED -->
        <div class="comic-box bg-red-100 p-4 relative">
          <div class="flex justify-between items-center mb-3">
            <div class="bg-red-500 text-white font-comic text-2xl px-3 py-1 border-2 border-black shadow-[3px_3px_0px_#000]">
              SIDE B / OMEGA SQUAD
            </div>
            <span id="count-b" class="font-comic text-xl bg-white border-2 border-black px-2 py-0.5">0 FIGHTERS</span>
          </div>

          <!-- TEAM AFFILIATION PRESET SELECTOR -->
          <div id="team-preset-b-container" class="hidden mb-4 p-2 bg-red-200 border-2 border-black">
            <label class="block font-bold text-xs uppercase mb-1">⚡ Load Entire Team Affiliation:</label>
            <select id="team-preset-b" onchange="loadTeamPreset('B')" class="comic-box w-full p-2 font-bold bg-white text-sm">
              <option value="">-- Select Team Preset --</option>
            </select>
          </div>
          
          <div id="team-b-slots" class="space-y-3"></div>

          <button id="add-b-btn" onclick="addTeamSlot('B')" class="comic-btn mt-4 w-full bg-red-300 font-comic text-lg py-1.5 hover:bg-red-200">
            + ADD INDIVIDUAL FIGHTER
          </button>
        </div>

      </div>

      <!-- ACTION CONTROLS & FASTTRACK TOGGLE -->
      <div class="comic-box bg-white p-4 text-center flex flex-col md:flex-row items-center justify-center gap-6">
        
        <!-- FASTTRACK TOGGLE SWITCH -->
        <label class="flex items-center gap-3 cursor-pointer select-none border-2 border-black bg-yellow-100 p-2 px-4 shadow-[3px_3px_0px_#000]">
          <input type="checkbox" id="fasttrack-toggle" class="w-6 h-6 accent-red-600 cursor-pointer">
          <span class="font-comic text-2xl text-red-600 tracking-wide uppercase">⚡ FASTTRACK (INSTANT RESULTS)</span>
        </label>

        <!-- ENGAGE BUTTON -->
        <button onclick="startBattle()" class="comic-btn bg-yellow-400 hover:bg-yellow-300 text-black text-3xl md:text-4xl font-comic px-8 py-2 uppercase tracking-wider animate-bounce">
          ⚔️ ENGAGE COMBAT! ⚔️
        </button>
      </div>

      <!-- COMBAT DISPLAY ARENA -->
      <div id="arena" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        
        <!-- TEAM A DISPLAY CARDS -->
        <div id="display-team-a" class="space-y-4"></div>

        <!-- COMBAT LOG / CENTER PANEL -->
        <div class="comic-box bg-yellow-100 p-4 lg:col-span-1 order-last lg:order-none sticky top-4">
          <h2 class="font-comic text-3xl text-center bg-black text-yellow-400 py-1 mb-3 border-2 border-black">
            BATTLE LOG
          </h2>
          <div id="battle-log" class="h-96 overflow-y-auto p-3 bg-white border-2 border-black font-mono text-sm space-y-2">
            <p class="text-gray-500 text-center italic">Waiting for combat initialization...</p>
          </div>
        </div>

        <!-- TEAM B DISPLAY CARDS -->
        <div id="display-team-b" class="space-y-4"></div>

      </div>

    </div>
  </main>

  <script>
    const CHARACTERS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGfw_4b0iqj-AkMzNQIJdTnr9q6E1O5ugB_XsPPxyt-OHrtHTXENmKgxqVIw9rHcpFGjCymtCbzMKM/pub?gid=0&single=true&output=csv';
    const IMAGES_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGfw_4b0iqj-AkMzNQIJdTnr9q6E1O5ugB_XsPPxyt-OHrtHTXENmKgxqVIw9rHcpFGjCymtCbzMKM/pub?gid=1288957876&single=true&output=csv';
    
    // CUSTOM DEFAULT FALLBACK IMAGE URL
    const DEFAULT_IMAGE_URL = 'https://lh3.googleusercontent.com/pw/AP1GczNkKm8SA_pgICC4HzoxybrbdNzCWYHeSN1ZwwdyC1GeMpW-gdvwnOyksxEb5OCymkOBXjxTU9VbFOeEBhfsQq25xaMsYN9stWqP0mMLLihZVKUyXMVh3SK0lHxz_Fit7rTpdowFE9ZZu-k94Y2cG3OHLg=w728-h1031-s-no-gm?authuser=0';

    let characterMap = new Map();
    let teamAffiliationMap = new Map();
    let battleMode = '1v1'; // '1v1' or 'team'
    let activeSimulationTimer = null;
    const SOUND_EFFECTS = ['BAM!', 'POW!', 'KABOOM!', 'CRUNCH!', 'ZAP!', 'WHAM!', 'SLAP!', 'BANG!'];

    window.addEventListener('DOMContentLoaded', async () => {
      await loadData();
    });

    async function loadData() {
      try {
        const [charsRes, imagesRes] = await Promise.all([
          fetchCSV(CHARACTERS_CSV),
          fetchCSV(IMAGES_CSV)
        ]);

        // Process Images Map
        const imageMap = new Map();
        imagesRes.data.forEach(img => {
          if (!img.character_id) return;
          const cid = parseInt(img.character_id);
          if (!imageMap.has(cid)) imageMap.set(cid, []);
          if (img.url && img.url.startsWith('http')) {
            imageMap.get(cid).push(img.url);
          }
        });

        // Process Characters
        charsRes.data.forEach(c => {
          if (!c.id || !c.codename) return;
          const id = parseInt(c.id);
          const imgs = imageMap.get(id) || [];
          
          // Select single image or default fallback
          const selectedImage = imgs.length > 0 ? imgs[0] : DEFAULT_IMAGE_URL;

          const charObj = {
            id: id,
            codename: c.codename,
            realName: c.real_name || '',
            alignment: c.alignment || 'Unknown',
            universe: c.universe || 'Unknown',
            teamAffiliation: c.team_affiliation || 'None',
            stats: {
              power: parseInt(c.power) || 50,
              strength: parseInt(c.strength) || 50,
              speed: parseInt(c.speed) || 50,
              durability: parseInt(c.durability) || 50,
              intelligence: parseInt(c.intelligence) || 50,
              combatSkill: parseInt(c.combat_skill) || 50,
              willpower: parseInt(c.willpower) || 50,
              luck: parseInt(c.luck) || 50
            },
            image: selectedImage,
            notes: c.notes || ''
          };

          characterMap.set(id, charObj);

          // Group by Team Affiliation
          if (charObj.teamAffiliation && charObj.teamAffiliation !== 'None' && charObj.teamAffiliation !== '') {
            const teams = charObj.teamAffiliation.split(',').map(t => t.trim());
            teams.forEach(team => {
              if (!teamAffiliationMap.has(team)) teamAffiliationMap.set(team, []);
              teamAffiliationMap.get(team).push(id);
            });
          }
        });

        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('battle-ui').classList.remove('hidden');

        populateTeamPresetSelects();
        setBattleMode('1v1');
      } catch (err) {
        console.error('Data Loading Error:', err);
        document.getElementById('loading-state').innerHTML = `<h2 class="font-comic text-3xl text-red-600">FAILED TO LOAD DATA</h2><p class="text-sm mt-2">${err.message}</p>`;
      }
    }

    function fetchCSV(url) {
      return new Promise((resolve, reject) => {
        Papa.parse(url, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: results => resolve(results),
          error: err => reject(err)
        });
      });
    }

    function populateTeamPresetSelects() {
      const sortedTeams = Array.from(teamAffiliationMap.keys()).sort();
      ['A', 'B'].forEach(side => {
        const select = document.getElementById(`team-preset-${side.toLowerCase()}`);
        select.innerHTML = '<option value="">-- Select Team Preset --</option>';
        sortedTeams.forEach(team => {
          const opt = document.createElement('option');
          opt.value = team;
          opt.textContent = `${team} (${teamAffiliationMap.get(team).length} Members)`;
          select.appendChild(opt);
        });
      });
    }

    function setBattleMode(mode) {
      battleMode = mode;
      const btn1v1 = document.getElementById('mode-1v1');
      const btnTeam = document.getElementById('mode-team');
      const presetA = document.getElementById('team-preset-a-container');
      const presetB = document.getElementById('team-preset-b-container');

      if (mode === '1v1') {
        btn1v1.className = 'comic-btn px-4 py-2 font-comic text-2xl bg-cyan-400 hover:bg-cyan-300';
        btnTeam.className = 'comic-btn px-4 py-2 font-comic text-2xl bg-gray-200 hover:bg-yellow-300';
        presetA.classList.add('hidden');
        presetB.classList.add('hidden');
        
        clearTeamSlots('A');
        clearTeamSlots('B');
        addTeamSlot('A');
        addTeamSlot('B');
      } else {
        btnTeam.className = 'comic-btn px-4 py-2 font-comic text-2xl bg-yellow-400 hover:bg-yellow-300';
        btn1v1.className = 'comic-btn px-4 py-2 font-comic text-2xl bg-gray-200 hover:bg-cyan-300';
        presetA.classList.remove('hidden');
        presetB.classList.remove('hidden');
      }
    }

    function clearTeamSlots(team) {
      const container = document.getElementById(`team-${team.toLowerCase()}-slots`);
      container.innerHTML = '';
      updateFighterCount(team);
    }

    function addTeamSlot(team, charId = '') {
      const container = document.getElementById(`team-${team.toLowerCase()}-slots`);
      const selectClass = team === 'A' ? 'char-select-a' : 'char-select-b';

      const sorted = Array.from(characterMap.values()).sort((a, b) => a.codename.localeCompare(b.codename));

      const div = document.createElement('div');
      div.className = 'flex gap-2 items-center';
      
      let optionsHtml = '<option value="">-- Select Character --</option>';
      sorted.forEach(c => {
        const selected = c.id == charId ? 'selected' : '';
        optionsHtml += `<option value="${c.id}" ${selected}>${c.codename} (${c.universe})</option>`;
      });

      div.innerHTML = `
        <select class="${selectClass} comic-box w-full p-2 font-bold bg-white focus:outline-none text-sm md:text-base" onchange="updateFighterCount('${team}')">
          ${optionsHtml}
        </select>
        <button onclick="this.parentElement.remove(); updateFighterCount('${team}');" class="comic-btn bg-red-500 text-white font-comic px-3 py-1 hover:bg-red-600">✕</button>
      `;
      
      container.appendChild(div);
      updateFighterCount(team);
    }

    function loadTeamPreset(team) {
      const select = document.getElementById(`team-preset-${team.toLowerCase()}`);
      const selectedTeam = select.value;
      if (!selectedTeam) return;

      clearTeamSlots(team);
      const memberIds = teamAffiliationMap.get(selectedTeam) || [];
      memberIds.forEach(id => {
        addTeamSlot(team, id);
      });
    }

    function updateFighterCount(team) {
      const selects = document.querySelectorAll(`.char-select-${team.toLowerCase()}`);
      let count = 0;
      selects.forEach(s => { if (s.value) count++; });
      document.getElementById(`count-${team.toLowerCase()}`).textContent = `${count} FIGHTERS`;
    }

    function startBattle() {
      if (activeSimulationTimer) clearInterval(activeSimulationTimer);

      const teamAIds = Array.from(document.querySelectorAll('.char-select-a')).map(s => s.value).filter(Boolean);
      const teamBIds = Array.from(document.querySelectorAll('.char-select-b')).map(s => s.value).filter(Boolean);

      if (teamAIds.length === 0 || teamBIds.length === 0) {
        alert('Please select at least one fighter for both Side A and Side B!');
        return;
      }

      const teamA = teamAIds.map(id => createCombatant(characterMap.get(parseInt(id))));
      const teamB = teamBIds.map(id => createCombatant(characterMap.get(parseInt(id))));

      document.getElementById('arena').classList.remove('hidden');
      
      renderCards('display-team-a', teamA, 'A');
      renderCards('display-team-b', teamB, 'B');

      const isFasttrack = document.getElementById('fasttrack-toggle').checked;
      runCombatSimulation(teamA, teamB, isFasttrack);
    }

    function createCombatant(char) {
      const stats = char.stats;
      const maxHp = (stats.durability * 8) + (stats.strength * 3) + (stats.willpower * 2);
      
      return {
        ...char,
        hp: maxHp,
        maxHp: maxHp,
        isDefeated: false
      };
    }

    function renderCards(containerId, team, side) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      team.forEach((c, idx) => {
        const card = document.createElement('div');
        card.id = `card-${side}-${idx}`;
        card.className = `comic-box bg-white p-3 relative transition-all duration-300`;
        card.innerHTML = `
          <div class="relative h-56 border-2 border-black overflow-hidden mb-2 bg-gray-100">
            <img src="${c.image}" class="w-full h-full object-cover object-top" alt="${c.codename}">
            <div class="absolute bottom-0 inset-x-0 bg-black/80 text-white p-1 text-center font-comic text-xl">
              ${c.codename}
            </div>
          </div>
          
          <!-- HEALTH BAR -->
          <div class="space-y-1 mb-2">
            <div class="flex justify-between font-bold text-xs">
              <span>HP</span>
              <span id="hp-text-${side}-${idx}">${c.hp} / ${c.maxHp}</span>
            </div>
            <div class="w-full bg-gray-300 border-2 border-black h-4 relative">
              <div id="hp-bar-${side}-${idx}" class="bg-green-500 h-full transition-all duration-200" style="width: 100%"></div>
            </div>
          </div>

          <!-- STATS GRID -->
          <div class="grid grid-cols-4 gap-1 text-[10px] text-center font-bold">
            <div class="bg-yellow-200 p-1 border border-black">PWR: ${c.stats.power}</div>
            <div class="bg-red-200 p-1 border border-black">STR: ${c.stats.strength}</div>
            <div class="bg-blue-200 p-1 border border-black">SPD: ${c.stats.speed}</div>
            <div class="bg-purple-200 p-1 border border-black">INT: ${c.stats.intelligence}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function runCombatSimulation(teamA, teamB, isFasttrack) {
      const log = document.getElementById('battle-log');
      log.innerHTML = '';

      function appendLog(text, style = '') {
        const p = document.createElement('p');
        p.className = `leading-tight ${style}`;
        p.innerHTML = text;
        log.appendChild(p);
      }

      appendLog(`<b>⚡ BATTLE INITIALIZED ⚡</b>`, 'text-blue-600 font-bold border-b pb-1');

      let turn = 1;
      const MAX_TURNS = 2000; // Expanded to handle large teams without stopping prematurely

      if (isFasttrack) {
        // INSTANT COMBAT EXECUTION LOOP
        while (turn <= MAX_TURNS) {
          const activeA = teamA.filter(c => !c.isDefeated);
          const activeB = teamB.filter(c => !c.isDefeated);

          if (activeA.length === 0 || activeB.length === 0) break;

          const attackerA = activeA[Math.floor(Math.random() * activeA.length)];
          const defenderB = activeB[Math.floor(Math.random() * activeB.length)];
          executeAttack(attackerA, defenderB, 'A', 'B', teamB.indexOf(defenderB), appendLog);

          if (!defenderB.isDefeated) {
            const defenderA = activeA[Math.floor(Math.random() * activeA.length)];
            executeAttack(defenderB, defenderA, 'B', 'A', teamA.indexOf(defenderA), appendLog);
          }
          turn++;
        }

        const activeA = teamA.filter(c => !c.isDefeated);
        const winner = activeA.length > 0 ? 'SIDE A (ALPHA SQUAD)' : 'SIDE B (OMEGA SQUAD)';
        appendLog(`<br><b class="text-xl text-red-600 bg-yellow-300 px-2 py-1 border border-black block text-center">🏆 VICTORY FOR ${winner}! 🏆</b>`);
        log.scrollTop = log.scrollHeight;
      } else {
        // STEP-BY-STEP ANIMATED COMBAT LOOP
        activeSimulationTimer = setInterval(() => {
          const activeA = teamA.filter(c => !c.isDefeated);
          const activeB = teamB.filter(c => !c.isDefeated);

          if (activeA.length === 0 || activeB.length === 0 || turn > MAX_TURNS) {
            clearInterval(activeSimulationTimer);
            const winner = activeA.length > 0 ? 'SIDE A (ALPHA SQUAD)' : 'SIDE B (OMEGA SQUAD)';
            appendLog(`<br><b class="text-xl text-red-600 bg-yellow-300 px-2 py-1 border border-black block text-center">🏆 VICTORY FOR ${winner}! 🏆</b>`);
            log.scrollTop = log.scrollHeight;
            return;
          }

          const attackerA = activeA[Math.floor(Math.random() * activeA.length)];
          const defenderB = activeB[Math.floor(Math.random() * activeB.length)];
          executeAttack(attackerA, defenderB, 'A', 'B', teamB.indexOf(defenderB), appendLog);

          if (!defenderB.isDefeated) {
            const defenderA = activeA[Math.floor(Math.random() * activeA.length)];
            executeAttack(defenderB, defenderA, 'B', 'A', teamA.indexOf(defenderA), appendLog);
          }

          log.scrollTop = log.scrollHeight;
          turn++;
        }, 500);
      }
    }

    function executeAttack(attacker, defender, attackerSide, defenderSide, defenderIdx, logFn) {
      const s = attacker.stats;
      const sDef = defender.stats;

      const rawDmg = (s.power * 0.4) + (s.strength * 0.3) + (s.combatSkill * 0.3);
      const defense = (sDef.durability * 0.25) + (sDef.speed * 0.15);
      
      const luckFactor = (Math.random() * s.luck) - (Math.random() * sDef.luck);
      const sfx = SOUND_EFFECTS[Math.floor(Math.random() * SOUND_EFFECTS.length)];

      let finalDmg = Math.max(15, Math.round(rawDmg - defense + (luckFactor * 0.5)));
      let isCrit = Math.random() * 100 < (s.combatSkill * 0.25);

      if (isCrit) {
        finalDmg = Math.round(finalDmg * 1.5);
      }

      defender.hp = Math.max(0, defender.hp - finalDmg);

      const critText = isCrit ? `<span class="text-red-600 font-comic text-base">CRITICAL HIT!</span> ` : '';
      const sideColor = attackerSide === 'A' ? 'text-cyan-700' : 'text-red-700';
      logFn(`<span class="${sideColor} font-bold">${attacker.codename}</span> strikes <span class="font-bold">${defender.codename}</span> with <b class="text-black">${sfx}</b> ${critText}for <b>${finalDmg}</b> DMG!`);

      const hpBar = document.getElementById(`hp-bar-${defenderSide}-${defenderIdx}`);
      const hpText = document.getElementById(`hp-text-${defenderSide}-${defenderIdx}`);
      
      if (hpBar && hpText) {
        const hpPct = Math.max(0, (defender.hp / defender.maxHp) * 100);
        hpBar.style.width = `${hpPct}%`;
        hpText.textContent = `${defender.hp} / ${defender.maxHp}`;

        if (hpPct < 30) {
          hpBar.className = 'bg-red-600 h-full transition-all duration-200';
        } else if (hpPct < 60) {
          hpBar.className = 'bg-yellow-500 h-full transition-all duration-200';
        }
      }

      if (defender.hp === 0 && !defender.isDefeated) {
        defender.isDefeated = true;
        logFn(`<b class="text-red-600">💥 ${defender.codename} HAS BEEN KO'D!</b>`);
        const card = document.getElementById(`card-${defenderSide}-${defenderIdx}`);
        if (card) {
          card.classList.add('opacity-40', 'grayscale');
        }
      }
    }
  </script>
</body>
</html>
